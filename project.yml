name: BugMe
options:
  bundleIdPrefix: com.bugme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BugMe:
    type: application
    platform: iOS
    sources: [BugMe]
    settings:
      base:
        PRODUCT_NAME: BugMe
        PRODUCT_BUNDLE_IDENTIFIER: com.bugme.personal.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZA5H95QAW8
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BugMe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BugMe listens when you tap the mic so you can add tasks by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "BugMe turns your voice into tasks, on your iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
